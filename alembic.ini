[alembic]
script_location = migrations
# Override with `-x url=...` or the QK_DATABASE_URL environment variable.
sqlalchemy.url = sqlite:///quantumkey.sqlite3

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
