[project]
name = "quantumkey"
version = "0.1.0"
description = "Post-quantum (ML-DSA) authenticator research prototype"
requires-python = ">=3.12"
# Exact, validated versions are pinned in phase2/requirements.lock.txt.
dependencies = [
    "liboqs-python==0.16.0.1",
    "fastapi>=0.162",
    "SQLAlchemy>=2.1",
    "uvicorn>=0.54",
    "httpx>=0.28",
    "cryptography>=50",
    "argon2-cffi>=25.1",
    "pydantic>=2.14",
    "alembic>=1.20",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3"]
test = ["pytest>=9"]

[tool.pytest.ini_options]
testpaths = ["tests", "phase2/tests"]
filterwarnings = [
    # Starlette's TestClient deprecation notice is unrelated to QuantumKey.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
