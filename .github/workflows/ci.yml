name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  LIBOQS_VERSION: "0.16.0"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qk_test_user
          POSTGRES_PASSWORD: qk_test_password
          POSTGRES_DB: qk_test_server
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qk_test_user -d qk_test_server"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build liboqs ${{ env.LIBOQS_VERSION }}
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          git clone --depth 1 --branch ${LIBOQS_VERSION} https://github.com/open-quantum-safe/liboqs.git
          cmake -S liboqs -B liboqs/build -GNinja -DBUILD_SHARED_LIBS=ON \
            -DOQS_BUILD_ONLY_LIB=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build liboqs/build
          sudo cmake --install liboqs/build
          sudo ldconfig
      - name: Install
        run: pip install -e ".[test,postgres]"
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Server tests (PostgreSQL)
        env:
          QK_TEST_DATABASE_URL: postgresql+psycopg://qk_test_user:qk_test_password@127.0.0.1:5432/qk_test_server
        run: python -m pytest tests/server -q
